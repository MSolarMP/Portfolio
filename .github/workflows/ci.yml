name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders so Better Auth doesn't log config errors while pages are collected.
          # The build never queries the database or signs anything; real values live in Vercel.
          BETTER_AUTH_SECRET: ci-build-placeholder-not-used-at-runtime-000000
          BETTER_AUTH_URL: http://localhost:3000
